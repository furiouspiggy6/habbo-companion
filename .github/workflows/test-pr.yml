name: Validate Companion pull requests
on:
  pull_request:
    branches: [main]
    paths:
      - 'Habbo_Companion.pyw'
      - 'headless_transport.py'
      - 'local_classic_launch.py'
      - 'habbo_tcp.py'
      - 'Habbo_Update_Helper.py'
      - 'tests/**'
      - 'scripts/playwright_smoke.py'
      - '.github/workflows/test-pr.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m py_compile Habbo_Companion.pyw Habbo_Update_Helper.py headless_transport.py local_classic_launch.py habbo_tcp.py
      - name: Install boofuzz for local-only integration test
        run: python -m pip install --disable-pip-version-check boofuzz==0.4.2
      - name: Run non-Windows unit tests
        run: python -m unittest discover -s tests -v

  playwright-windows:
    name: Windows Playwright CDP smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Playwright runtime (use existing system browser)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: playwright==1.65.2
      - name: Run local isolated-browser Playwright smoke test
        shell: pwsh
        run: python scripts/playwright_smoke.py
      - name: Construct and navigate modern Tkinter workspace (no network)
        shell: pwsh
        run: python scripts/ui_smoke.py
